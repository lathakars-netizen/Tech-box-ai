<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Phone outline -->
  <rect x="40" y="20" width="220" height="360" rx="24" ry="24" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <!-- Screen -->
  <rect x="55" y="50" width="190" height="290" rx="8" ry="8" fill="#0f172a"/>
  <!-- Camera icon -->
  <circle cx="150" cy="160" r="35" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
  <circle cx="150" cy="160" r="20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <line x1="150" y1="90" x2="150" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="160" x2="220" y2="160" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Text -->
  <text x="150" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Image</text>
  <text x="150" y="263" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Coming Soon</text>
  <!-- Home bar -->
  <rect x="115" y="355" width="70" height="4" rx="2" fill="#334155"/>
</svg>
