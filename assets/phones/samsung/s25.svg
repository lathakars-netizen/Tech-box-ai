<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <linearGradient id="bodyGradS25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradS25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <!-- Frame (More compact aspect) -->
  <rect x="42" y="25" width="236" height="370" rx="34" ry="34" fill="url(#bodyGradS25)" stroke="#c084fc" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Display -->
  <rect x="54" y="37" width="212" height="346" rx="26" ry="26" fill="#020617"/>
  <rect x="54" y="37" width="212" height="346" rx="26" ry="26" fill="url(#screenGradS25)"/>
  <!-- Punch hole camera -->
  <circle cx="160" cy="52" r="4.5" fill="#000000" stroke="#334155" stroke-width="1.5"/>
  <!-- Triple Camera Accent -->
  <g transform="translate(70, 72)">
    <circle cx="12" cy="12" r="9" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="12" cy="36" r="9" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="12" cy="60" r="9" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
  </g>
  <!-- Device Label -->
  <text x="160" y="215" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-size="16" font-weight="700" fill="#c084fc" letter-spacing="1">GALAXY S25</text>
  <text x="160" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">6.2″ Compact Dynamic AMOLED</text>
  <text x="160" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Snapdragon 8 Elite • 162g Compact</text>
  <!-- Brand Badge -->
  <rect x="110" y="315" width="100" height="24" rx="12" fill="#7e22ce" fill-opacity="0.2" stroke="#c084fc" stroke-width="1"/>
  <text x="160" y="331" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f3e8ff">SAMSUNG</text>
</svg>
