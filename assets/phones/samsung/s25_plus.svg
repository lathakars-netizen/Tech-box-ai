<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <!-- Frame -->
  <rect x="35" y="15" width="250" height="390" rx="36" ry="36" fill="url(#bodyGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Display -->
  <rect x="48" y="28" width="224" height="364" rx="28" ry="28" fill="#020617"/>
  <rect x="48" y="28" width="224" height="364" rx="28" ry="28" fill="url(#screenGrad)"/>
  <!-- Punch hole camera -->
  <circle cx="160" cy="45" r="5" fill="#000000" stroke="#334155" stroke-width="1.5"/>
  <!-- Triple Camera Accent (Floating icon style) -->
  <g transform="translate(68, 65)">
    <circle cx="14" cy="14" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="14" cy="42" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="14" cy="70" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <!-- Device Label -->
  <text x="160" y="220" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="1">GALAXY S25+</text>
  <text x="160" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">6.7″ Dynamic AMOLED 2X</text>
  <text x="160" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Snapdragon 8 Elite • 50MP OIS</text>
  <!-- Brand Badge -->
  <rect x="110" y="320" width="100" height="24" rx="12" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <text x="160" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#bae6fd">SAMSUNG</text>
</svg>
